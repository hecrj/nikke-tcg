name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required repository secrets:
#   GITLAB_TOKEN   - GitLab personal access token with the read_repository scope for
#                    hecrj/nikke-tcg-assets (needed to check out the `external` submodule)
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitLab token for submodule
        shell: bash
        run: |
          if [ -z "${{ secrets.GITLAB_TOKEN }}" ]; then
            echo "::error::Missing GITLAB_TOKEN secret (personal access token with read_repository scope for hecrj/nikke-tcg-assets)"
            exit 1
          fi
          # Rewrite the submodule's SSH URL to HTTPS authenticated with the token
          git config --global url."https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "git@gitlab.com:"

          # The `external` submodule stores its assets (*.zip, *.png) via Git LFS:
          # enable the smudge filter so the checkout downloads real files, not pointers
          if ! command -v git-lfs >/dev/null 2>&1; then
            echo "::error::git-lfs is not installed on the runner"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Verify LFS assets
        shell: bash
        run: |
          zip=external/Nikke_TCG_v2.3.0.zip
          if [ "$(head -c 2 "$zip")" != "PK" ]; then
            echo "::error::$zip does not look like a zip (first bytes: $(head -c 80 "$zip" | tr -d '\n'))"
            echo "This usually means Git LFS did not run during checkout (pointer file instead of content)."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Extract
        run: uv run extract

      - name: Generate
        run: uv run generate

      - name: Bundle
        run: uv run bundle

      - name: Package
        run: uv run package

      - name: Summarize
        shell: bash
        run: |
          echo "build/: $(du -sh build | cut -f1) across $(find build -type f | wc -l | tr -d ' ') files"
          for dir in build/*/; do
            echo "  $(basename "$dir"): $(du -sh "$dir" | cut -f1)"
          done
          echo ""
          echo "SHA256 manifest"
          find build -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Upload Nikke - Core
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Core
          path: build/Nikke - Core
          if-no-files-found: error
          retention-days: 1

      - name: Upload Nikke - Destiny
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Destiny
          path: build/Nikke - Destiny
          if-no-files-found: error
          retention-days: 1

      - name: Upload Nikke - Accessories
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Accessories
          path: build/Nikke - Accessories
          if-no-files-found: error
          retention-days: 1

      - name: Upload Nikke - Figurines
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Figurines
          path: build/Nikke - Figurines
          if-no-files-found: error
          retention-days: 1

      - name: Upload Nikke - Posters
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Posters
          path: build/Nikke - Posters
          if-no-files-found: error
          retention-days: 1

      - name: Upload Nikke - Theme
        uses: actions/upload-artifact@v4
        with:
          name: Nikke - Theme
          path: build/Nikke - Theme
          if-no-files-found: error
          retention-days: 1
