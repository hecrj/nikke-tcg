name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required repository secrets:
#   GITLAB_TOKEN   - GitLab personal access token with the read_repository scope for
#                    hecrj/nikke-tcg-assets (needed to check out the `external` submodule)
#   UNITY_EMAIL    - Unity account email. The bundle step signs in with these
#   UNITY_PASSWORD - credentials so the Licensing Client fetches the Personal
#                    entitlement fresh for the runner. The account must NOT have
#                    two-factor auth enabled (headless sign-in can't complete 2FA);
#                    a dedicated CI account is recommended.
jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Install vcredist2013
        run: choco install vcredist2013 -y --no-progress

      - name: Configure GitLab token for submodule
        shell: bash
        run: |
          if [ -z "${{ secrets.GITLAB_TOKEN }}" ]; then
            echo "::error::Missing GITLAB_TOKEN secret (personal access token with read_repository scope for hecrj/nikke-tcg-assets)"
            exit 1
          fi
          # Rewrite the submodule's SSH URL to HTTPS authenticated with the token
          git config --global url."https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "git@gitlab.com:"

          # The `external` submodule stores its assets (*.zip, *.png) via Git LFS:
          # enable the smudge filter so the checkout downloads real files, not pointers
          if ! command -v git-lfs >/dev/null 2>&1; then
            echo "::error::git-lfs is not installed on the runner"
            exit 1
          fi

      - name: Install Unity 2021.3.45f2
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: None
          unity-version: 2021.3.45f2

      - name: Verify Unity installation
        run: |
          $unity = 'C:\Program Files\Unity\Hub\Editor\2021.3.45f2\Editor\Unity.exe'
          if (-not (Test-Path $unity)) {
            throw "Unity 2021.3.45f2 not found at $unity (UNITY_EDITOR_PATH='${env:UNITY_EDITOR_PATH}'). Pin install-path in unity-setup to match bundle()'s hardcoded path."
          }

      - name: Verify Unity account secrets
        run: |
          if ([string]::IsNullOrEmpty($env:UNITY_EMAIL) -or [string]::IsNullOrEmpty($env:UNITY_PASSWORD)) {
            Write-Error "Missing UNITY_EMAIL/UNITY_PASSWORD secrets. The bundle step signs in with these to activate the Personal license on the runner."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Verify LFS assets
        shell: bash
        run: |
          zip=external/Nikke_TCG_v2.3.0.zip
          if [ "$(head -c 2 "$zip")" != "PK" ]; then
            echo "::error::$zip does not look like a zip (first bytes: $(head -c 80 "$zip" | tr -d '\n'))"
            echo "This usually means Git LFS did not run during checkout (pointer file instead of content)."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Bundle
        run: uv run bundle

      - name: Extract
        run: uv run extract

      - name: Generate
        run: uv run generate

      - name: Bundle
        run: uv run bundle

      - name: Package
        run: uv run package

      - name: Summarize
        run: |
          $root = (Get-Location).Path
          $files = Get-ChildItem -Path build -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum

          Write-Host ("build/: {0:N2} MB across {1} files" -f ($total / 1MB), $files.Count)

          Get-ChildItem -Path build -Directory | ForEach-Object {
            $size = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host ("  {0}: {1:N2} MB" -f $_.Name, ($size / 1MB))
          }

          Write-Host ""
          Write-Host "SHA256 manifest"
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
            $relative = $file.FullName.Substring($root.Length + 1)
            Write-Host ("{0}  {1}" -f $hash, $relative)
          }

      # Return the Personal seat activated during Bundle so repeated CI runs
      # don't exhaust the account's activation limit. Runs even on failure, but
      # only once Unity was installed (skipped if an earlier setup step failed).
      - name: Return Unity license
        if: always()
        continue-on-error: true
        run: |
          $unity = 'C:\Program Files\Unity\Hub\Editor\2021.3.45f2\Editor\Unity.exe'
          if ((Test-Path $unity) -and $env:UNITY_EMAIL -and $env:UNITY_PASSWORD) {
            & $unity -batchmode -nographics -quit -logFile - `
              -returnlicense -username $env:UNITY_EMAIL -password $env:UNITY_PASSWORD
          } else {
            Write-Host "Skipping license return (Unity not installed or credentials absent)"
          }
